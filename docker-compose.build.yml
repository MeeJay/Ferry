# Same stack, built from source: docker compose -f docker-compose.build.yml up -d --build
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ferry
      POSTGRES_USER: ferry
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ferry -d ferry"]
      interval: 5s
      timeout: 5s
      retries: 20

  server:
    build: { context: ., dockerfile: server/Dockerfile }
    image: meejay/ferry-server:dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://ferry:${DB_PASSWORD:-changeme}@postgres:5432/ferry
      SESSION_SECRET: ${SESSION_SECRET:-dev-secret-change-me}
      APP_URL: ${APP_URL:-}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-loopback, linklocal, uniquelocal}
      DEFAULT_ADMIN_USERNAME: ${DEFAULT_ADMIN_USERNAME:-admin}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-admin123}
    volumes:
      - ferry_data:/data

  client:
    build: { context: ., dockerfile: client/Dockerfile }
    image: meejay/ferry-client:dev
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "${LISTEN_PORT:-8080}:80"

volumes:
  postgres_data:
  ferry_data:
