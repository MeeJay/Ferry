# Use an existing PostgreSQL (13+). Required in .env: DATABASE_URL, SESSION_SECRET.
#   docker compose -f docker-compose.external-db.yml up -d
services:
  server:
    image: meejay/ferry-server:${FERRY_VERSION:-latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set in .env}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET must be set in .env}
      APP_URL: ${APP_URL:-}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-loopback, linklocal, uniquelocal}
      DEFAULT_ADMIN_USERNAME: ${DEFAULT_ADMIN_USERNAME:-admin}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-admin123}
      UPLOAD_CHUNK_MB: ${UPLOAD_CHUNK_MB:-50}
    volumes:
      - ${DATA_PATH:-ferry_data}:/data

  client:
    image: meejay/ferry-client:${FERRY_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "${LISTEN_PORT:-8080}:80"

volumes:
  ferry_data:
