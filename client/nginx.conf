# Ferry client container: serves the SPA and forwards everything dynamic to
# the server container. This is NOT the edge proxy — put your own reverse proxy
# (Traefik, Nginx Proxy Manager, HAProxy, Caddy…) in front of the published port
# and terminate TLS there.

upstream ferry_server {
    server server:3001;
    keepalive 16;
}

# Keep the scheme/host seen by the edge proxy when there is one.
map $http_x_forwarded_proto $fwd_proto { default $http_x_forwarded_proto; '' $scheme; }
map $http_x_forwarded_host  $fwd_host  { default $http_x_forwarded_host;  '' $http_host; }

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Uploads are chunked by tus (UPLOAD_CHUNK_MB, 50 MB by default); ShareX
    # sends whole files. Sizes are enforced by the server, not here.
    client_max_body_size 0;

    set $csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self'; connect-src 'self'; frame-src 'self'; frame-ancestors 'self'; base-uri 'self'; object-src 'none'";

    location = /healthz { access_log off; return 200 "ok\n"; }

    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # App routes → SPA shell.
    location = / { try_files /index.html =404; }
    location ~ ^/(login|my|settings|admin)(/|$) { try_files /index.html =404; }

    # Dynamic endpoints → server.
    location ~ ^/(api|auth|raw|branding|health)(/|$) {
        proxy_pass http://ferry_server;
        include /etc/nginx/conf.d/ferry-proxy.inc;
    }

    # Static files from the bundle (favicon, theme-init.js…), else a share link → server.
    location / {
        try_files $uri @server;
    }
    location @server {
        proxy_pass http://ferry_server;
        include /etc/nginx/conf.d/ferry-proxy.inc;
    }
}
